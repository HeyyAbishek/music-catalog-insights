version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: music_catalog_db
    restart: always
    environment:
      POSTGRES_DB: music_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: